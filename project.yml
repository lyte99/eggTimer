name: EggTimer
options:
  bundleIdPrefix: com.andrewegelhof
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EggTimer:
    type: application
    platform: macOS
    sources: [EggTimer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewegelhof.EggTimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Egg Timer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_IDENTITY: "-"
  EggTimerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [EggTimerTests]
    dependencies:
      - target: EggTimer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  EggTimer:
    build:
      targets:
        EggTimer: all
    test:
      targets: [EggTimerTests]
